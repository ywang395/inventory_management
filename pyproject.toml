[project]
name = "cafe-inventory"
version = "0.1.0"
description = "Barcode-based inventory for a café and ice cream shop"
# Match the Lambda runtime (Python 3.12) so code that passes locally also runs in AWS.
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.pytest.ini_options]
# Lambda code is packaged from /backend, so tests import it the same way: `from core import ...`.
# CDK code runs from /infra (`from stacks import ...`); local scripts live in /scripts.
pythonpath = ["backend", "infra", "scripts"]
testpaths = ["backend/tests", "infra/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Folders that hold our own modules, so imports are sorted as first-party.
src = ["backend", "backend/tests", "infra", "scripts"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scripts add /backend to sys.path before importing from it.
"scripts/*" = ["E402"]

[dependency-groups]
dev = [
    "aws-cdk-lib==2.273.0",
    "boto3>=1.43.114",
    "botocore[crt]>=1.43.114",
    "constructs>=10.8.1",
    "moto[dynamodb]>=5.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "segno>=1.6.6",
]
